server:
  port: 4000

spring:
  profiles:
    active: dev
  application:
    name: auth-service
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR} # Nacos 服务器地址
    loadbalancer:
      cache:
        enabled: true # 负载均衡缓存
    openfeign:
      circuitbreaker:
        enabled: true # 开启熔断器
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL} # 数据库地址
    username: ${DB_USERNAME}  # 数据库用户名
    password: ${DB_PASSWORD}  # 数据库密码
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false

  # Redis 配置
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      database: 0
      timeout: 3000ms # 连接超时时间
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms # 最大阻塞等待时间
          max-idle: 8
          min-idle: 0

  # RabbitMQ 配置
  rabbitmq:
    host: ${RABBITMQ_HOST}  # RabbitMQ 主机地址
    port: ${RABBITMQ_PORT}  # RabbitMQ 端口号
    username: ${RABBITMQ_USERNAME}  # RabbitMQ 用户名
    password: ${RABBITMQ_PASSWORD}  # RabbitMQ 密码
    virtual-host: /
    # 消息确认机制
    publisher-confirm-type: correlated # 发送确认
    publisher-returns: true # 发送返回
    template:
      mandatory: true # 消息路由失败时返回给生产者
    listener:
      simple:
        acknowledge-mode: manual # 手动确认
        retry:
          enabled: true # 开启重试
          max-attempts: 3 # 最大重试次数

management:
  tracing:
    sampling:
      probability: 1.0
    baggage:
      remote-fields:
        - X-User-Id
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl