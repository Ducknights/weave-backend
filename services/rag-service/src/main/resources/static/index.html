<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weave RAG 知识问答</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 720px;
            max-width: 95vw;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 16px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 85vh;
            max-height: 800px;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            padding: 16px 24px;
            font-size: 18px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #4ade80;
        }

        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .msg {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 10px;
            line-height: 1.6;
            font-size: 14px;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .msg.user {
            align-self: flex-end;
            background: #667eea;
            color: #fff;
            border-bottom-right-radius: 4px;
        }

        .msg.bot {
            align-self: flex-start;
            background: #f0f0f0;
            color: #333;
            border-bottom-left-radius: 4px;
        }

        .msg.bot.streaming {
            border-left: 3px solid #667eea;
        }

        .quick-btns {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            padding: 0 24px 12px;
        }

        .quick-btns button {
            padding: 6px 14px;
            border: 1px solid #e0e0e0;
            border-radius: 16px;
            background: #fff;
            font-size: 13px;
            color: #555;
            cursor: pointer;
            transition: all 0.2s;
        }

        .quick-btns button:hover {
            border-color: #667eea;
            color: #667eea;
        }

        .input-area {
            display: flex;
            gap: 10px;
            padding: 14px 24px;
            border-top: 1px solid #eee;
            background: #fafafa;
        }

        .input-area input {
            flex: 1;
            padding: 10px 16px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-area input:focus {
            border-color: #667eea;
        }

        .input-area button {
            padding: 10px 24px;
            background: #667eea;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
            white-space: nowrap;
        }

        .input-area button:hover {
            background: #5a6fd6;
        }

        .input-area button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .loading {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #999;
            animation: blink 1.4s infinite both;
            margin-left: 4px;
        }

        .loading:nth-child(2) {
            animation-delay: 0.2s;
        }

        .loading:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes blink {

            0%,
            80%,
            100% {
                opacity: 0;
            }

            40% {
                opacity: 1;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <span class="dot"></span>Weave RAG 知识问答
        </div>

        <div class="chat-area" id="chatArea">
            <div class="msg bot">你好！我是学生手册知识问答助手，有什么可以帮你的？</div>
        </div>

        <div class="quick-btns" id="quickBtns">
            <button onclick="askQuick('学分绩点怎么计算？')">学分绩点怎么计算？</button>
            <button onclick="askQuick('国家奖学金的金额是多少？')">国家奖学金金额</button>
            <button onclick="askQuick('男生1000米跑的及格标准是什么？')">体测 1000米 标准</button>
            <button onclick="askQuick('申请免听课程需要什么条件？')">免听课程条件</button>
        </div>

        <div class="input-area">
            <input id="questionInput" placeholder="输入你的问题..." onkeydown="if(event.key==='Enter') ask()">
            <button id="sendBtn" onclick="ask()">发送（流式）</button>
        </div>
    </div>

    <script>
        const API = '/api/rag';
        const chatArea = document.getElementById('chatArea');
        const input = document.getElementById('questionInput');
        const sendBtn = document.getElementById('sendBtn');
        const quickBtns = document.getElementById('quickBtns');

        function addMsg(role, text, streaming) {
            const div = document.createElement('div');
            div.className = 'msg ' + role + (streaming ? ' streaming' : '');
            div.textContent = text;
            chatArea.appendChild(div);
            chatArea.scrollTop = chatArea.scrollHeight;
            return div;
        }

        function setLoading(loading) {
            sendBtn.disabled = loading;
            input.disabled = loading;
            quickBtns.querySelectorAll('button').forEach(b => b.disabled = loading);
        }

        async function askQuick(q) {
            input.value = q;
            ask();
        }

        async function ask() {
            const question = input.value.trim();
            if (!question) return;

            addMsg('user', question);
            input.value = '';
            setLoading(true);

            const msgDiv = addMsg('bot', '', true);
            msgDiv.innerHTML = '<span class="loading"></span><span class="loading"></span><span class="loading"></span>';

            try {
                const res = await fetch(API + '/ask/stream', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question })
                });

                if (!res.ok) {
                    msgDiv.textContent = '请求失败: ' + res.status;
                    msgDiv.classList.remove('streaming');
                    return;
                }

                const reader = res.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';
                let fullText = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop() || '';

                    for (const line of lines) {
                        if (line.startsWith('data:')) {
                            const chunk = line.startsWith('data: ') ? line.slice(6) : line.slice(5);
                            fullText += chunk;
                            msgDiv.textContent = fullText;
                            chatArea.scrollTop = chatArea.scrollHeight;
                        }
                    }
                }
                msgDiv.classList.remove('streaming');
                if (!fullText) msgDiv.textContent = '未获取到回答。';

            } catch (err) {
                msgDiv.textContent = '连接失败: ' + err.message;
                msgDiv.classList.remove('streaming');
            } finally {
                setLoading(false);
            }
        }
    </script>
</body>

</html>
